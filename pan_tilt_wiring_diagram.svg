<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Pan-tilt platform wiring diagram</title>
  <rect width="1280" height="800" fill="#FFFFFF"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#16222A">Pan-tilt platform: how everything connects</text>
  <text x="40" y="76" font-size="15" fill="#55666D">The ESP32 is powered from the laptop. The servos are powered from the power bank. Only the grounds are shared.</text>

  <!-- breadboard -->
  <rect x="290" y="125" width="925" height="490" rx="14" fill="#F4F6F5" stroke="#D5DCD9" stroke-width="2"/>
  <text x="310" y="152" font-size="15" font-weight="700" fill="#7A8A90">Breadboard</text>

  <!-- rails -->
  <rect x="560" y="190" width="640" height="20" rx="10" fill="#C0392B"/>
  <rect x="560" y="550" width="640" height="20" rx="10" fill="#16222A"/>
  <text x="1200" y="180" font-size="14" font-weight="700" fill="#C0392B" text-anchor="end">+ rail (5 V)</text>
  <text x="1200" y="594" font-size="14" font-weight="700" fill="#16222A" text-anchor="end">− rail (GND)</text>

  <!-- legend -->
  <rect x="40" y="96" width="240" height="152" rx="8" fill="#FFFFFF" stroke="#D5DCD9" stroke-width="2"/>
  <g font-size="14" fill="#16222A">
    <line x1="56" y1="122" x2="96" y2="122" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/><text x="108" y="127">5 V (servo power)</text>
    <line x1="56" y1="148" x2="96" y2="148" stroke="#16222A" stroke-width="5" stroke-linecap="round"/><text x="108" y="153">GND</text>
    <line x1="56" y1="174" x2="96" y2="174" stroke="#E08A00" stroke-width="5" stroke-linecap="round"/><text x="108" y="179">GPIO18: pan signal</text>
    <line x1="56" y1="200" x2="96" y2="200" stroke="#2F6DB5" stroke-width="5" stroke-linecap="round"/><text x="108" y="205">GPIO19: tilt signal</text>
    <line x1="56" y1="224" x2="96" y2="224" stroke="#7A8A90" stroke-width="5" stroke-linecap="round"/><text x="108" y="229">USB cable</text>
  </g>

  <!-- laptop and USB -->
  <rect x="40" y="352" width="160" height="60" rx="8" fill="#EEF3F1" stroke="#16222A" stroke-width="2"/>
  <text x="120" y="378" font-size="17" font-weight="700" fill="#16222A" text-anchor="middle">Laptop</text>
  <text x="120" y="398" font-size="13" fill="#55666D" text-anchor="middle">USB port</text>
  <line x1="200" y1="382" x2="300" y2="382" stroke="#7A8A90" stroke-width="6" stroke-linecap="round"/>
  <text x="245" y="368" font-size="13" fill="#55666D" text-anchor="middle">USB cable</text>
  <text x="245" y="406" font-size="12" fill="#55666D" text-anchor="middle">power + upload</text>

  <!-- key points -->
  <rect x="40" y="470" width="250" height="130" rx="8" fill="#FFF3D1" stroke="#F2A900" stroke-width="2"/>
  <g font-size="14" fill="#16222A">
    <text x="54" y="496" font-weight="700">Key points</text>
    <text x="54" y="520">• ESP32: powered by the laptop</text>
    <text x="54" y="541">• Servos: powered by the bank</text>
    <text x="54" y="562">• Only the grounds are shared</text>
    <text x="54" y="583">• Never feed servos from 3V3</text>
  </g>

  <!-- wires (drawn before parts that sit on top) -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- GPIO19 tilt signal -->
    <path d="M520 322 H540 V160 H920 V382" stroke="#2F6DB5"/>
    <!-- GPIO18 pan signal -->
    <path d="M520 382 H660" stroke="#E08A00"/>
    <!-- ESP32 GND to - rail -->
    <path d="M520 442 H540 V560 H580" stroke="#16222A"/>
    <!-- pan strip power -->
    <path d="M720 382 V200" stroke="#C0392B"/>
    <path d="M780 382 V560" stroke="#16222A"/>
    <!-- tilt strip power -->
    <path d="M980 382 V200" stroke="#C0392B"/>
    <path d="M1040 382 V560" stroke="#16222A"/>
    <!-- power bank leads -->
    <path d="M460 690 H620 V560" stroke="#16222A"/>
    <path d="M460 715 H1240 V200 H1200" stroke="#C0392B"/>
  </g>
  <!-- rail junction dots -->
  <g>
    <circle cx="720" cy="200" r="7" fill="#C0392B"/><circle cx="980" cy="200" r="7" fill="#C0392B"/><circle cx="1200" cy="200" r="7" fill="#C0392B"/>
    <circle cx="580" cy="560" r="7" fill="#16222A"/><circle cx="620" cy="560" r="7" fill="#16222A"/><circle cx="780" cy="560" r="7" fill="#16222A"/><circle cx="1040" cy="560" r="7" fill="#16222A"/>
  </g>

  <!-- capacitor across rails -->
  <g stroke="#16222A" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="1130" y1="210" x2="1130" y2="370"/>
    <line x1="1110" y1="370" x2="1150" y2="370"/>
    <line x1="1110" y1="390" x2="1150" y2="390"/>
    <line x1="1130" y1="390" x2="1130" y2="550"/>
  </g>
  <circle cx="1130" cy="200" r="7" fill="#C0392B"/><circle cx="1130" cy="560" r="7" fill="#16222A"/>
  <g font-size="13" fill="#16222A">
    <text x="1158" y="364" font-weight="700">470 µF</text>
    <text x="1158" y="382">long leg: +</text>
    <text x="1158" y="400">stripe: −</text>
  </g>

  <!-- ESP32 -->
  <rect x="300" y="250" width="220" height="220" rx="12" fill="#1F7A6B"/>
  <text x="385" y="340" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32</text>
  <text x="385" y="364" font-size="14" fill="#FFFFFF" text-anchor="middle">DevKit</text>
  <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="end">
    <text x="504" y="327">GPIO19</text>
    <text x="504" y="387">GPIO18</text>
    <text x="504" y="447">GND</text>
  </g>
  <g fill="#F2A900" stroke="#FFFFFF" stroke-width="2">
    <circle cx="520" cy="322" r="7"/><circle cx="520" cy="382" r="7"/><circle cx="520" cy="442" r="7"/>
  </g>

  <!-- servo header strips -->
  <rect x="635" y="335" width="170" height="90" rx="8" fill="#16222A"/>
  <text x="645" y="354" font-size="12" font-weight="700" fill="#FFFFFF">Pan servo</text>
  <rect x="895" y="335" width="170" height="90" rx="8" fill="#16222A"/>
  <text x="905" y="354" font-size="12" font-weight="700" fill="#FFFFFF">Tilt servo</text>
  <g fill="#F2A900" stroke="#FFFFFF" stroke-width="2">
    <circle cx="660" cy="382" r="9"/><circle cx="720" cy="382" r="9"/><circle cx="780" cy="382" r="9"/>
    <circle cx="920" cy="382" r="9"/><circle cx="980" cy="382" r="9"/><circle cx="1040" cy="382" r="9"/>
  </g>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="660" y="414">SIG</text><text x="720" y="414">5 V</text><text x="780" y="414">GND</text>
    <text x="920" y="414">SIG</text><text x="980" y="414">5 V</text><text x="1040" y="414">GND</text>
  </g>

  <!-- power bank and adapter -->
  <rect x="40" y="640" width="160" height="70" rx="8" fill="#EEF3F1" stroke="#16222A" stroke-width="2"/>
  <text x="120" y="681" font-size="17" font-weight="700" fill="#16222A" text-anchor="middle">USB power bank</text>
  <line x1="200" y1="675" x2="260" y2="675" stroke="#7A8A90" stroke-width="6" stroke-linecap="round"/>
  <rect x="260" y="630" width="200" height="100" rx="8" fill="#EEF3F1" stroke="#16222A" stroke-width="2"/>
  <text x="360" y="672" font-size="15" font-weight="700" fill="#16222A" text-anchor="middle">USB-A plug with</text>
  <text x="360" y="692" font-size="15" font-weight="700" fill="#16222A" text-anchor="middle">screw terminals</text>
  <text x="360" y="712" font-size="12" fill="#55666D" text-anchor="middle">leads end in Dupont pins</text>
  <text x="472" y="682" font-size="13" font-weight="700" fill="#16222A">black lead: GND</text>
  <text x="472" y="708" font-size="13" font-weight="700" fill="#C0392B">red lead: 5 V</text>

  <text x="40" y="775" font-size="13" fill="#55666D">Check your servo's wire colours: orange or yellow is signal, red is 5 V, brown or black is GND. The 3V3 pin is not used.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
